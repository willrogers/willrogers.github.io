---
layout: main
---

<h1>Hattie maths</h1>
<div id="card">
  <p id="mathstext" class="rotator"></p>
  <input id="mathsanswer" value="" />
  <div id="mathsresult">?</div>
  <button id="mathsbutton">Start</button>
  <div id="childchooser">
    <div>
      <input type="radio" id="joseph" name="child" value="joseph" checked />
      <label for="joseph">Joseph</label>
    </div>
    <div>
      <input type="radio" id="harriet" name="child" value="harriet" />
      <label for="harriet">Harriet</label>
    </div>
  </div>
  <div id="mathstimer">20</div>
  <div id="mathsscorebox">
    <div>Score:</div>
    <div id="mathsscore">0</div>
  </div>
</div>
<script>
  const PLUS = "+";
  const TIMES = "x";
  const MINUS = "-";
  let plusmax = 99;
  let timesmax = 12;
  let ops = [PLUS, TIMES, MINUS];
  let maxes = { "+": plusmax, x: timesmax, "-": plusmax };
  const mathstext = document.getElementById("mathstext");
  const mathsresult = document.getElementById("mathsresult");
  const mathsbutton = document.getElementById("mathsbutton");
  const chooser = document.getElementById("childchooser");
  const timer = document.getElementById("mathstimer");
  let timerRunning = false;
  let started = false;

  const num = Math.floor(Math.random() * ops.length);
  let op = ops[num];
  let first = Math.floor(Math.random() * maxes[op]);
  let second = Math.floor(Math.random() * maxes[op]);

  function gen_plus() {
    first = Math.floor(Math.random() * plusmax);
    second = Math.floor(Math.random() * plusmax);
  }
  function gen_minus() {
    let numbers = [
      Math.floor(Math.random() * plusmax),
      Math.floor(Math.random() * plusmax),
    ];
    first = Math.max(numbers[0], numbers[1]);
    second = Math.min(numbers[0], numbers[1]);
  }
  function gen_times() {
    const bigFirst = Math.random() > 0.5;
    const firstLimit = bigFirst ? timesmax : 12;
    const secondLimit = bigFirst ? 12 : timesmax;
    first = Math.floor(Math.random() * (firstLimit - 2) + 2);
    second = Math.floor(Math.random() * (secondLimit - 2) + 2);
  }

  function gen_q() {
    const num = Math.floor(Math.random() * ops.length);
    op = ops[num];
    first = Math.floor(Math.random() * maxes[op]);
    let fns = { "+": gen_plus, x: gen_times, "-": gen_minus };
    fns[op]();
    let q = `${first} ${op} ${second} = `;
    mathstext.innerText = q;
    mathsanswer.value = "";
    mathsresult.innerText = "?";
    mathsbutton.disabled = true;
    mathsbutton.innerText = "Try again";
    started = true;
    mathsanswer.focus();
    timer.innerText = 20;
  }
  function modify_score(value) {
    document.getElementById("mathsscore").innerText =
      parseInt(document.getElementById("mathsscore").innerText) + value;
  }

  setInterval(() => {
    if (!timerRunning) return;
    const timer = document.getElementById("mathstimer");
    let time = parseInt(timer.innerText);
    timer.innerText = time - 1;
    if (parseInt(timer.innerText) <= 0) {
      gen_q();
      modify_score(-1);
      mathsresult.innerText = "❌";
      timer.innerText = 20;
    }
  }, 1000);

  /* Update text whenever enter is pressed. */
  mathsanswer.onkeyup = (event) => {
    value = event.target.value;
    if (event.key !== "Enter") {
      mathsresult.innerText = "?";
      return;
    }
    if (value == "") {
      mathsresult.innerText = "?";
      mathsbutton.disabled = true;
    } else if (op == PLUS && parseInt(value) == first + second) {
      mathsresult.innerText = "✅";
      mathsbutton.disabled = false;
      timerRunning = false;
      modify_score(1);
    } else if (op == TIMES && parseInt(value) == first * second) {
      mathsresult.innerText = "✅";
      timerRunning = false;
      mathsbutton.disabled = false;
      modify_score(1);
    } else if (
      op == MINUS &&
      parseInt(value) == Math.max(first, second) - Math.min(first, second)
    ) {
      mathsresult.innerText = "✅";
      timerRunning = false;
      mathsbutton.disabled = false;
      modify_score(1);
    } else {
      mathsresult.innerText = "❌";
      modify_score(-1);
      mathsbutton.disabled = true;
    }
  };

  function next_q() {
    gen_q();
    document.getElementById("mathstimer").innerText = 20;
    timerRunning = true;
    mathsanswer.focus();
  }

  mathsbutton.onclick = () => {
    next_q();
  };
  /* Change difficulty. */
  chooser.onclick = () => {
    const child = document.querySelector('input[name="child"]:checked').value;
    if (child == "joseph") {
      plusmax = 99;
      timesmax = 12;
      ops = [PLUS, TIMES, MINUS];
    } else {
      plusmax = 20;
      timesmax = 4;
      ops = [PLUS, TIMES, MINUS];
    }
    next_q();
  };
</script>
